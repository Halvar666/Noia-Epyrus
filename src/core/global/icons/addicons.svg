<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 14 14"
     xml:space="preserve">

  <defs>
    <style type="text/css">
      use:not(:target) {
        display: none;
      }

      #addicon {
        fill: #5AAA20;
      }
    </style>

    <g id="addicon-shape">
      <circle cx="7" cy="7" r="6"/>
      <rect x="3" y="6" width="8" height="2" fill="#f8f8f8"/>
      <rect x="6" y="3" width="2" height="8" fill="#f8f8f8"/>
    </g>
	
  </defs>

  <use id="addicon"                 xlink:href="#addicon-shape"/>
</svg>
